<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1>🔴 Media Management</h1>
            <p class="subtitle">Cloud-powered file storage</p>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Login</button>
                <button class="tab" onclick="switchTab('signup')">Sign Up</button>
            </div>
            
            <form id="authForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required minlength="4">
                </div>
                <div class="form-group" id="adminCheckbox" style="display:none;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isAdmin">
                        <span>Create as Admin Account</span>
                    </label>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Login</button>
                <div class="message" id="message"></div>
            </form>
        </div>
    </div>

    <script>
        let currentAction = 'login';

        function switchTab(action) {
            currentAction = action;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('adminCheckbox').style.display = action === 'signup' ? 'block' : 'none';
            document.getElementById('submitBtn').textContent = action === 'login' ? 'Login' : 'Sign Up';
            document.getElementById('message').textContent = '';
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const isAdmin = document.getElementById('isAdmin').checked;
            const message = document.getElementById('message');
            
            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, action: currentAction, isAdmin })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    message.textContent = '✅ Success! Redirecting...';
                    message.className = 'message success';
                    setTimeout(() => {
                        window.location.href = data.isAdmin ? '/admin.html' : '/home.html';
                    }, 1000);
                } else {
                    message.textContent = '❌ ' + data.error;
                    message.className = 'message error';
                }
            } catch (error) {
                message.textContent = '❌ Connection error';
                message.className = 'message error';
            }
        });
    </script>
</body>
</html>
